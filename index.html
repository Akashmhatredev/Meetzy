<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Meetzy · Less planning. More meeting.</title>
    <meta
      name="description"
      content="Bring your friends together. Meetzy finds the fairest place in between using real travel times, then helps your group pick a venue and vote."
    />
    <meta name="theme-color" content="#F7F9FC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101827" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Meetzy · Less planning. More meeting." />
    <meta property="og:description" content="Your friends are everywhere. Meetzy finds the middle." />
    <meta property="og:image" content="/icons/og-image.png" />
    <script>
      // Apply the saved theme before first paint to avoid a light flash.
      ;(function () {
        try {
          var pref = localStorage.getItem('meetzy:theme') || 'system'
          var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Meetzy needs JavaScript to plan your hangout.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
